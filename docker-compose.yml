version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: quant_postgres
    environment:
      POSTGRES_DB: quant_algo_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: quant_backend
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/quant_algo_db
      - APP_ENV=development
      - JWT_SECRET_KEY=supersecretjwtkeyforquantplatform2026
    depends_on:
      postgres:
        condition: service_healthy

  dashboard:
    image: php:8.3-apache
    container_name: quant_dashboard
    ports:
      - "8080:80"
    volumes:
      - ./dashboard:/var/www/html
    environment:
      - FASTAPI_BASE_URL=http://backend:8000/api/v1

volumes:
  pgdata:
